<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Text Extractor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="wrap">
    <h1>PDF Text Extractor</h1>
    <p class="sub">Upload a PDF and get a clean, page-by-page list of its text.</p>

    <div id="dropzone" class="dropzone">
      <input type="file" id="fileInput" accept="application/pdf,.pdf" hidden>
      <p><strong>Click to choose a file</strong> or drag a PDF here</p>
      <p id="fileName" class="filename"></p>
    </div>

    <div id="status" class="status" hidden></div>

    <section id="results" class="results" hidden>
      <div class="results-header">
        <h2 id="resultsTitle"></h2>
        <div class="actions">
          <button id="copyBtn" type="button">Copy all text</button>
          <button id="downloadBtn" type="button">Download .txt</button>
        </div>
      </div>
      <div id="pages"></div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
